name: setup
description: Go with its caches; with sandbox, uv of deck's image, and on Linux bubblewrap with user namespaces open.
inputs:
  sandbox:
    description: Install uv as deck's image has it, and on Linux bubblewrap with user namespaces open
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    - if: runner.os == 'Linux' && inputs.sandbox == 'true'
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - if: runner.os == 'Linux' && inputs.sandbox == 'true'
      shell: bash
      run: |
        command -v bwrap && exit 0
        for try in 1 2 3; do
          timeout 120 sudo apt-get install -y -q -o Acquire::Retries=3 bubblewrap && exit 0
          timeout 120 sudo apt-get update -q -o Acquire::Retries=3 || true
        done
        exit 1
    - if: runner.os == 'Linux' && inputs.sandbox == 'true'
      shell: bash
      run: |
        image=$(sed -n 's|^FROM \(ghcr.io/astral-sh/uv:[^ ]*\) AS uv$|\1|p' Dockerfile)
        id=$(docker create "$image" /uv) && sudo docker cp "$id:/uv" /usr/local/bin/uv && docker rm "$id" && uv --version
    - if: runner.os == 'macOS' && inputs.sandbox == 'true'
      shell: bash
      run: command -v uv || brew install uv
