name: setup
description: Go with its caches; on Linux with sandbox, bubblewrap with user namespaces open for the sandbox of deck.
inputs:
  sandbox:
    description: Install bubblewrap and open user namespaces on Linux
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - if: runner.os == 'Linux' && inputs.sandbox == 'true'
      shell: bash
      run: |
        command -v bwrap && exit 0
        for try in 1 2 3; do
          timeout 120 sudo apt-get install -y -q -o Acquire::Retries=3 bubblewrap && exit 0
          timeout 120 sudo apt-get update -q -o Acquire::Retries=3 || true
        done
        exit 1
