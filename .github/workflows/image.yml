# deck's image from compose.yaml on a bare docker, when what builds or runs it changes and every night.
name: image

on:
  push:
    branches: [master]
    paths: [Dockerfile, compose.yaml, .dockerignore, .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, compose.yaml, .dockerignore, .github/workflows/image.yml]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: DECK_SERVER=1 go test -count=1 -timeout 35m -v -run TestServerFromScratch ./tests/scenarios
