# The tests with the race detector on macOS, a shard a package of scenarios as in ci.yml: nightly on master and by
# hand (gh workflow run macos.yml --ref <branch or tag>); it only tells, a release needs ci alone.
name: macos

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"

jobs:
  race:
    name: race (macos ${{ matrix.areas }})
    strategy:
      fail-fast: false
      matrix:
        areas: [box, chat, egress, modules, owner/1/2, owner/2/2, providers/1/2, providers/2/2, runs, rest]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          sandbox: true
      - run: go test -race -count=1 -timeout 25m $(.github/shard.sh ${{ matrix.areas }})
