# A tag v* of a commit of master that ci made green pushes the server image to ghcr.io as the version and latest, then
# releases deck's binaries, deck.app and the Windows installer with release.json signed by DECK_RELEASE_KEY.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The commit is of master and ci made it green
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          git merge-base --is-ancestor "$SHA" origin/master || { echo "$SHA is not a commit of master"; exit 1; }
          # A run of ci still going is waited for, up to 40 minutes.
          for _ in $(seq 80); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" --json status,conclusion)
            jq -e 'any(.[]; .conclusion == "success")' <<< "$runs" > /dev/null && exit 0
            jq -e 'any(.[]; .status != "completed")' <<< "$runs" > /dev/null || break
            sleep 30
          done
          echo "ci has no green run of $SHA"; exit 1

  version:
    needs: green
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "the tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  binaries:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build deck for each system, with and without the tailnet
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/}
            for tags in "" tailnet; do
              name=deck-$os-$arch${tags:+-$tags}
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -tags "$tags" \
                -ldflags "-s -w -X deck2/internal/release.Version=$VERSION -X deck2/internal/release.Commit=$COMMIT" \
                -o dist/$name ./cmd/deck
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: dist/

  mac:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build deck.app
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: desktop/build.sh mac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac
          path: desktop/dist/deck-macos.zip

  windows:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Build the Windows installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: desktop/build.sh windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: desktop/dist/deck-setup.exe

  release:
    needs: [version, binaries, mac, windows, manifest]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign the list of the files
        env:
          DECK_RELEASE_KEY: ${{ secrets.DECK_RELEASE_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: go run ./cmd/deck-release -version "$VERSION" -commit "$COMMIT" -out dist dist/deck-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "deck $VERSION" --generate-notes

  image:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and push the image of this system
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform "linux/$ARCH" --push --provenance=false \
            --build-arg VERSION="$VERSION" --build-arg COMMIT="$COMMIT" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$IMAGE:$VERSION-$ARCH" .

  manifest:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Tag both systems as the version and latest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$VERSION" latest; do
            docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          done
