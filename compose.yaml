# deck: docker compose up -d, then docker compose exec deck deck pair prints a link that pairs a device; on this
# machine deck is http://deck.localhost:7700. On a server with a domain put DECK_DOMAIN (its name) and
# COMPOSE_PROFILES=domain in .env, and Caddy serves deck over https there. seccomp.json and deck-box.apparmor lie
# beside it; README, "Install", says the rest.
name: deck
services:
  deck:
    image: ghcr.io/teaarte/deck:latest
    init: true
    restart: unless-stopped
    shm_size: 512m
    # bubblewrap builds the box of every foreign program: namespaces, its own /proc, mount; nothing else is loosened.
    security_opt:
      - seccomp=./seccomp.json
      - systempaths=unconfined
      - apparmor=deck-box
    environment:
      DECK_PUBLIC: ${DECK_DOMAIN:+https://${DECK_DOMAIN}}
      # deck takes X-Forwarded-For only from Caddy below and from the gateway of its network, the host's tailscale
      # serve; safe while the ports below stay on 127.0.0.1 (any engine); publish them wider and DECK_PROXY=caddy in .env.
      DECK_PROXY: ${DECK_PROXY:-caddy,gateway}
      DECK_TAILSCALE: ${DECK_TAILSCALE:-}
      TZ: ${TZ:-}
    ports:
      - "127.0.0.1:7700:7700"
      - "127.0.0.1:7701:7701"
    volumes:
      - deck:/var/lib/deck
  caddy:
    image: caddy:2
    restart: unless-stopped
    # Only with a domain: on one computer deck takes no port 80 or 443.
    profiles: [domain]
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy:/data
volumes:
  deck:
  caddy:
configs:
  caddyfile:
    content: |
      ${DECK_DOMAIN:-localhost} {
        header Strict-Transport-Security "max-age=31536000"
        header Referrer-Policy no-referrer
        reverse_proxy deck:7700
      }
      ${DECK_DOMAIN:-localhost}:8443 {
        header Strict-Transport-Security "max-age=31536000"
        header Referrer-Policy no-referrer
        reverse_proxy deck:7701
      }
