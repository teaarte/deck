<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; height: 100%; background: transparent; } iframe { border: 0; width: 100%; height: 100%; display: block; }</style>
</head>
<body>
<script>
const host = "{{HOST}}";
// guard keeps WebRTC, which no CSP of every browser stops, out of a window, and frames, where it would come back,
// out of its documents: no API of the window makes, parses or inserts one.
const tags = "iframe, frame, object, embed";
const tagged = /<\s*([\w-]+:)?(iframe|frame|object|embed)\b/i;
const refuse = () => { throw new Error("deck: a custom block holds no frames"); };
const guard = (w) => {
  for (const k of Object.getOwnPropertyNames(w)) {
    if (/^(webkit)?RTC/.test(k)) try { Object.defineProperty(w, k, { value: undefined, configurable: false }); } catch {}
  }
  const nodes = (a) => { for (const n of a) if (n && (n.matches?.(tags) || n.querySelector?.(tags))) refuse(); };
  const texts = (a) => { for (const v of a) if (tagged.test(String(v))) refuse(); };
  const wrap = (proto, names, check) => {
    for (const m of names) {
      const was = proto && Object.hasOwn(proto, m) && proto[m];
      if (typeof was === "function") proto[m] = function (...a) { check(a); return was.apply(this, a); };
    }
  };
  const inserts = ["appendChild", "insertBefore", "replaceChild", "append", "prepend", "after", "before", "replaceWith",
    "insertAdjacentElement", "replaceChildren", "moveBefore", "insertNode", "surroundContents"];
  for (const p of [w.Node, w.Element, w.CharacterData, w.DocumentType, w.Document, w.DocumentFragment, w.Range]) wrap(p?.prototype, inserts, nodes);
  const parses = ["insertAdjacentHTML", "setHTMLUnsafe", "setHTML", "write", "writeln", "execCommand", "parseFromString", "createContextualFragment"];
  for (const p of [w.Element, w.ShadowRoot, w.Document, w.DOMParser, w.Range]) wrap(p?.prototype, parses, texts);
  wrap(w.Document, ["parseHTMLUnsafe"], texts);
  const named = (n) => { if (/^(iframe|frame|object|embed)$/i.test(String(n).split(":").pop())) refuse(); };
  wrap(w.Document.prototype, ["createElement"], (a) => named(a[0]));
  wrap(w.Document.prototype, ["createElementNS"], (a) => named(a[1]));
  for (const [p, name] of [[w.Element, "innerHTML"], [w.Element, "outerHTML"], [w.ShadowRoot, "innerHTML"]]) {
    const d = p && Object.getOwnPropertyDescriptor(p.prototype, name);
    if (d) Object.defineProperty(p.prototype, name, { ...d, set(v) { texts([v]); d.set.call(this, v); } });
  }
};
const inner = document.createElement("iframe");
inner.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms");
document.body.appendChild(inner);
guard(window);
addEventListener("message", (e) => {
  if (e.source === parent) {
    if (e.origin !== host) return;
    if (e.data && e.data.method === "ui/notifications/sandbox-resource-ready") {
      const doc = inner.contentDocument;
      doc.open();
      guard(inner.contentWindow);
      const html = String(e.data.params.html);
      doc.write(tagged.test(html) ? "<p>deck: a custom block holds no frames (iframe, frame, object, embed)</p>" : html);
      doc.close();
    } else if (inner.contentWindow) {
      inner.contentWindow.postMessage(e.data, "*");
    }
  } else if (e.source === inner.contentWindow && e.origin === location.origin) {
    parent.postMessage(e.data, host);
  }
});
parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/sandbox-proxy-ready", params: {} }, host);
</script>
</body>
</html>
