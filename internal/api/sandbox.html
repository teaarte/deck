<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; height: 100%; background: transparent; } iframe { border: 0; width: 100%; height: 100%; display: block; }</style>
</head>
<body>
<script>
const host = "{{HOST}}";
// guard, the first script of a block in a frame of an origin of its own, keeps WebRTC, which no CSP of every browser
// stops, out of its window and makes no frame, where it would come back: by name, parsed text, custom element, XSLT.
const guard = (w) => {
  const tagged = /<\s*([\w-]+:)?(iframe|frame|object|embed)\b/i;
  const refuse = () => { throw new Error("deck: a custom block holds no frames"); };
  for (const k of Object.getOwnPropertyNames(w)) {
    if (/^(webkit)?RTC/.test(k)) try { Object.defineProperty(w, k, { value: undefined, configurable: false }); } catch {}
  }
  try { Object.defineProperty(w, "XSLTProcessor", { value: undefined, configurable: false }); } catch {}
  const html = (s) => { if (tagged.test(s)) refuse(); };
  const name = (s) => { if (/^(iframe|frame|object|embed)$/i.test(s.split(":").pop())) refuse(); };
  // text turns the arguments at the places given into strings once, so what is checked is what the browser reads.
  const text = (proto, m, at, check) => {
    const was = proto && Object.hasOwn(proto, m) && proto[m];
    if (typeof was !== "function") return;
    proto[m] = function (...a) {
      for (const i of at ?? a.keys()) if (i < a.length && a[i] != null) check(a[i] = String(a[i]));
      return was.apply(this, a);
    };
  };
  const D = w.Document.prototype, E = w.Element.prototype, S = w.ShadowRoot?.prototype;
  text(D, "createElement", [0], name);
  text(D, "createElementNS", [1], name);
  text(w.DOMImplementation?.prototype, "createDocument", [1], name);
  text(E, "insertAdjacentHTML", [1], html);
  text(E, "setHTMLUnsafe", [0], html);
  text(S, "setHTMLUnsafe", [0], html);
  text(D, "write", null, html);
  text(D, "writeln", null, html);
  text(D, "execCommand", [2], html);
  text(w.DOMParser?.prototype, "parseFromString", [0], html);
  text(w.Range?.prototype, "createContextualFragment", [0], html);
  text(w.Document, "parseHTMLUnsafe", [0], html);
  for (const [p, n] of [[E, "innerHTML"], [E, "outerHTML"], [S, "innerHTML"]]) {
    const d = p && Object.getOwnPropertyDescriptor(p, n);
    if (d) Object.defineProperty(p, n, { ...d, set(v) { v = v == null ? "" : String(v); html(v); d.set.call(this, v); } });
  }
  const define = w.CustomElementRegistry?.prototype.define;
  if (define) w.CustomElementRegistry.prototype.define = function (n, c, o) {
    const ext = o?.extends;
    if (ext !== undefined) {
      o = { ...o, extends: String(ext) };
      name(o.extends);
    }
    return define.call(this, n, c, o);
  };
};
const tagged = /<\s*([\w-]+:)?(iframe|frame|object|embed)\b/i;
// guarded is the HTML of a block with the guard as its first script, after a doctype that keeps standards mode.
const guarded = (html) => {
  if (tagged.test(html)) return "<p>deck: a custom block holds no frames (iframe, frame, object, embed)</p>";
  const head = (/^\s*<!doctype[^>]*>/i.exec(html) || [""])[0];
  return head + "<script>(" + guard + ")(window);<\/script>" + html.slice(head.length);
};
const inner = document.createElement("iframe");
inner.setAttribute("sandbox", "allow-scripts allow-forms");
document.body.appendChild(inner);
guard(window);
addEventListener("message", (e) => {
  if (e.source === parent) {
    if (e.origin !== host) return;
    if (e.data && e.data.method === "ui/notifications/sandbox-resource-ready") {
      inner.srcdoc = guarded(String(e.data.params.html));
    } else if (inner.contentWindow) {
      inner.contentWindow.postMessage(e.data, "*");
    }
  } else if (e.source === inner.contentWindow) {
    parent.postMessage(e.data, host);
  }
});
parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/sandbox-proxy-ready", params: {} }, host);
</script>
</body>
</html>
